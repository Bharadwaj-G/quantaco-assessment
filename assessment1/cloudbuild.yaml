substitutions:
  _REGION: us-central1
  _SERVICE_NAME: weather-api
  _AR_REPO: quantaco-weather-api
  _INSTANCE_CONNECTION_NAME: primeval-span-307214:us-central1:weather-db
  _DB_USER: testuser
  _DB_NAME: weather-db
  _RUNTIME_SA: weather-api-sa@primeval-span-307214.iam.gserviceaccount.com
  _DB_PASS_SECRET: weather-db-password

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - -f
      - assessment1/Dockerfile
      - assessment1

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --service-account=${_RUNTIME_SA}
      - --set-env-vars=DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},INSTANCE_UNIX_SOCKET=/cloudsql/${_INSTANCE_CONNECTION_NAME}
      - --set-secrets=DB_PASS=${_DB_PASS_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
